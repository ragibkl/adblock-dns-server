version: "3"

services:
  dns:
    image: ragibkl/bancuh-dns:2
    restart: always
    privileged: true # For some reason, some distro needs this
    # Loopback only: dnsdist is the only client, and reaches this at
    # 127.0.0.1:1153. Published on all interfaces, it was an open resolver that
    # skipped dnsdist's rate limiting unless a cloud firewall happened to block it.
    ports:
      - 127.0.0.1:1153:53/tcp
      - 127.0.0.1:1153:53/udp
    env_file: .env
    environment:
      # TLS/DoT/DoH/ACME are handled by dnsdist, not by bancuh-dns.
      # .env is shared by both services, so TLS_ENABLED=true (meant for
      # dnsdist) must be overridden here or bancuh-dns starts its own
      # ACME run and fails the HTTP-01 challenge in a retry loop.
      TLS_ENABLED: "false"
      # Both images also read PORT from the shared .env. It is unset today, but
      # setting it for dnsdist would silently move bancuh-dns off 53 and break
      # the 1153:53 mapping below, so pin it here rather than rely on that.
      PORT: "53"
    volumes:
      - ../../data:/local-data/
    logging:
      driver: json-file
      options:
        max-size: 1m
        # 20 files held only about ten minutes of history on the busier nodes,
        # which loses the daily blocklist update and any crash before anyone can
        # look. Disk is not scarce here (~18G free), so keep an hour or so.
        max-file: "100"

  dnsdist:
    image: ragibkl/dnsdist-acme
    restart: always
    privileged: true # For some reason, some distro needs this
    network_mode: host
    env_file: .env
    environment:
      BACKEND: 127.0.0.1:1153
    volumes:
      - letsencrypt:/etc/letsencrypt
    logging:
      driver: json-file
      options:
        max-size: 1m
        # 20 files held only about ten minutes of history on the busier nodes,
        # which loses the daily blocklist update and any crash before anyone can
        # look. Disk is not scarce here (~18G free), so keep an hour or so.
        max-file: "100"

volumes:
  letsencrypt:
